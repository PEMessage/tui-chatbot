# uv-managed project — 通过 `uv sync` 安装后在 src/ 的修改即时生效
# 依赖 hatchling 做 build-backend；tool.uv.package = true 确保 entry points 正确安装
# without this
# warning: Skipping installation of entry points (`project.scripts`) for package `tui-chatbot` because this project is not packaged; to install entry points, set `tool.uv.package = true` or define a `build-system`
# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "tui-chatbot"
version = "0.1.0"
description = "A modern TUI chatbot with streaming output and TPS statistics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.30.0",
    "anthropic>=0.25.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.0.0",
]

[project.scripts]
chat = "tui_chatbot.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
